<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="brandLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="glyphGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle rounded badge -->
  <rect x="24" y="24" width="464" height="464" rx="140" fill="url(#brandLogoGrad)" />

  <!-- Glass Refraction Sheen -->
  <path d="M 30 160 C 30 85 85 30 160 30 H 352 C 427 30 482 85 482 160 C 350 210 162 210 30 160 Z" fill="#FFFFFF" fill-opacity="0.22" />

  <!-- Crisp Micro-Border -->
  <rect x="24" y="24" width="464" height="464" rx="140" fill="none" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="10" />

  <!-- Interlocking ER Monogram -->
  <g filter="url(#shadow)">
    <!-- Backbone E/R -->
    <path d="M 276 376 H 156 V 136 H 264" fill="none" stroke="url(#glyphGrad)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" />
    <!-- R Loop and E Middle Ribbon -->
    <path d="M 156 256 H 264 C 324 256 324 136 264 136" fill="none" stroke="url(#glyphGrad)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" />
    <!-- R Dynamic Kick -->
    <path d="M 246 256 L 348 376" fill="none" stroke="url(#glyphGrad)" stroke-width="38" stroke-linecap="round" />
    <!-- Cyan Automation Node / Spark -->
    <circle cx="372" cy="136" r="26" fill="#22D3EE" />
    <circle cx="372" cy="136" r="13" fill="#FFFFFF" />
  </g>
</svg>